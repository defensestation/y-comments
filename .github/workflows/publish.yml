name: Publish

on:
  push:
    branches: [main, dev]

# never let two publish runs on the same branch race
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build packages
        run: npm run build

      - name: Test
        run: npm test

      # main -> stable release on the `latest` tag. Idempotent: a version
      # already on npm is skipped, so re-pushing main without a version bump
      # is a no-op rather than a failure.
      - name: Publish release (main)
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in y-comments-core y-comments-prosemirror y-comments-blocknote; do
            name="@defensestation/$dir"
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
            else
              echo "publishing $name@$version"
              npm publish -w "$name" --tag latest --access public
            fi
          done

      # dev -> prerelease on the `dev` tag, versioned X.Y.Z-dev.<sha> so every
      # push is publishable and installable via `npm i pkg@dev`.
      - name: Publish prerelease (dev)
        if: github.ref == 'refs/heads/dev'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/set-dev-version.mjs "$(git rev-parse --short HEAD)"
          for dir in y-comments-core y-comments-prosemirror y-comments-blocknote; do
            name="@defensestation/$dir"
            echo "publishing dev $name"
            npm publish -w "$name" --tag dev --access public
          done
